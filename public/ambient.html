<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Discuz Ambient</title>
    <style>
      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
        background:
          radial-gradient(circle at 30% 25%, rgba(120, 172, 167, 0.42), transparent 34%),
          radial-gradient(circle at 70% 70%, rgba(156, 132, 105, 0.32), transparent 36%),
          linear-gradient(135deg, #f6f8f5, #dfe8e3 58%, #f4efe6);
        color: #21302f;
        font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        overflow: hidden;
      }

      .ambient {
        display: grid;
        width: 100%;
        height: 100%;
        place-items: center;
      }

      .panel {
        display: grid;
        width: min(360px, calc(100% - 40px));
        gap: 14px;
        justify-items: center;
        text-align: center;
      }

      .pulse {
        width: 104px;
        height: 104px;
        border: 1px solid rgba(42, 71, 68, 0.24);
        border-radius: 50%;
        background: rgba(255, 255, 255, 0.42);
        box-shadow: 0 22px 70px rgba(52, 76, 72, 0.18);
        animation: breathe 5.6s ease-in-out infinite;
      }

      h1 {
        margin: 0;
        font-size: 20px;
        font-weight: 650;
        letter-spacing: 0;
      }

      p {
        max-width: 28ch;
        margin: 0;
        color: rgba(33, 48, 47, 0.72);
        font-size: 14px;
        line-height: 1.6;
      }

      button {
        height: 40px;
        padding: 0 18px;
        border: 1px solid rgba(42, 71, 68, 0.2);
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.68);
        color: #21302f;
        cursor: pointer;
        font: inherit;
      }

      @keyframes breathe {
        0%,
        100% {
          transform: scale(0.94);
          opacity: 0.76;
        }
        50% {
          transform: scale(1.08);
          opacity: 1;
        }
      }
    </style>
  </head>
  <body>
    <main class="ambient">
      <section class="panel">
        <div class="pulse" aria-hidden="true"></div>
        <h1>轻音乐氛围</h1>
        <p>轻柔合成音会低音量循环播放，用于休息或安静讨论。</p>
        <button id="toggle" type="button">播放</button>
      </section>
    </main>
    <script>
      const button = document.getElementById("toggle");
      let context;
      let nodes = [];
      let playing = false;

      function startTone() {
        context = context || new AudioContext();
        if (nodes.length) return;
        const gain = context.createGain();
        gain.gain.value = 0.035;
        gain.connect(context.destination);

        const notes = [196, 246.94, 293.66, 329.63];
        nodes = notes.map((frequency, index) => {
          const oscillator = context.createOscillator();
          const noteGain = context.createGain();
          oscillator.type = index % 2 ? "sine" : "triangle";
          oscillator.frequency.value = frequency;
          noteGain.gain.value = 0.16 / notes.length;
          oscillator.connect(noteGain);
          noteGain.connect(gain);
          oscillator.start();
          return { oscillator, noteGain };
        });

        let step = 0;
        const timer = window.setInterval(() => {
          if (!playing || !context) {
            window.clearInterval(timer);
            return;
          }
          nodes.forEach(({ oscillator }, index) => {
            const next = notes[(step + index) % notes.length] * (index === 3 ? 0.5 : 1);
            oscillator.frequency.setTargetAtTime(next, context.currentTime, 1.8);
          });
          step += 1;
        }, 4200);
      }

      button.addEventListener("click", async () => {
        if (!playing) {
          playing = true;
          context = context || new AudioContext();
          await context.resume?.();
          startTone();
          button.textContent = "暂停";
          return;
        }
        playing = false;
        nodes.forEach(({ oscillator }) => oscillator.stop());
        nodes = [];
        button.textContent = "播放";
      });
    </script>
  </body>
</html>
